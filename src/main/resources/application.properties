# Local PostgreSQL settings. Supply environment variables before starting.
spring.application.name=voeemsog
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/voeemsog}
spring.datasource.username=${DB_USER:voeemsog}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
server.port=${PORT:8080}
